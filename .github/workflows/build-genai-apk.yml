name: Build ML Kit GenAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - android/genai/**
      - .github/workflows/build-genai-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: android/genai

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build official Debug APK
        working-directory: android/genai
        run: >-
          gradle :app:assembleDebug --no-daemon --max-workers=2 --console=plain
          -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify APK and record source revision
        run: |
          mkdir -p dist
          cp android/genai/app/build/outputs/apk/debug/app-debug.apk dist/MLKit-GenAI-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/MLKit-GenAI-debug.apk
          git rev-parse HEAD > dist/source-commit.txt
          cd dist
          sha256sum MLKit-GenAI-debug.apk > SHA256SUMS
          stat -c 'APK: %n (%s bytes)' MLKit-GenAI-debug.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLKit-GenAI-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
